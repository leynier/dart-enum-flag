name: enum_flag
description: Portable enum bit flags for Dart with typed FlagSet values, stable bit positions, and int extensions.
repository: https://github.com/leynier/dart-enum-flag
version: 3.0.0
topics: [enum, bitmask, flags]

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  meta: ">=1.9.0 <2.0.0"

dev_dependencies:
  coverage: ">=1.6.4 <2.0.0"
  test: ">=1.24.4 <2.0.0"
  very_good_analysis: ">=5.1.0 <12.0.0"
