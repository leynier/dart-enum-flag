name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze package
        run: dart analyze --fatal-infos --fatal-warnings
      - name: Validate publication
        run: dart pub publish --dry-run

  test:
    name: Test (${{ matrix.sdk }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.0.7', stable]
        platform: [vm, node]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install dependencies
        run: dart pub get
      - name: Run tests
        run: dart test --platform ${{ matrix.platform }}

  coverage:
    name: Coverage (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Collect coverage
        run: dart test --coverage=coverage
      - name: Format coverage
        run: >-
          dart run coverage:format_coverage
          --lcov
          --in=coverage
          --out=coverage/lcov.info
          --report-on=lib
      - name: Require 100% line coverage
        run: dart run tool/check_coverage.dart
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
